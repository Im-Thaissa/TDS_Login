<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrar — Trilha do Saber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{'/css/style-' + ${theme} + '.css'}">
</head>
<body>
<div class="auth-shell">
    <div class="auth-visual">
        <svg class="contours" viewBox="0 0 500 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M-20 650 Q 150 580 260 650 T 520 600" stroke="#7E9C82" stroke-width="1.5" fill="none"/>
            <path d="M-20 700 Q 170 630 280 700 T 520 660" stroke="#7E9C82" stroke-width="1.5" fill="none"/>
            <path d="M-20 750 Q 190 690 300 750 T 520 720" stroke="#7E9C82" stroke-width="1.5" fill="none"/>
            <path d="M-20 100 Q 140 40 250 110 T 520 60" stroke="#284A3E" stroke-width="1.5" fill="none"/>
            <path d="M-20 150 Q 160 90 270 160 T 520 120" stroke="#284A3E" stroke-width="1.5" fill="none"/>
        </svg>
        <svg class="trail" viewBox="0 0 500 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path class="trail-path" d="M60 740 C 120 620, 80 480, 180 420 C 280 360, 260 240, 360 160"/>
            <circle class="trail-dot-marker" cx="60" cy="740" r="6"/>
            <circle class="trail-dot-marker" cx="180" cy="420" r="6"/>
            <circle class="trail-dot-marker is-end" cx="360" cy="160" r="7"/>
        </svg>

        <div class="auth-visual__brand">
            <p class="eyebrow">Trilha do Saber</p>
            <h1>Cada etapa da sua jornada acadêmica, em um só lugar.</h1>
        </div>

        <p class="auth-visual__foot">Acesso para alunos, professores, coordenadores e administradores.</p>
    </div>

    <div class="auth-form-panel">
        <div class="form-card">
            <h2>Entrar</h2>
            <p class="subtitle">Informe suas credenciais para continuar.</p>

            <div class="alert alert-error" th:if="${param.error}"
                 th:text="${contaPendente} ? 'Sua conta ainda está pendente de aprovação.' : 'E-mail ou senha incorretos.'"></div>
            <div class="alert alert-success" th:if="${param.cadastroSucesso}">Cadastro enviado! Aguarde a aprovação do seu perfil para poder entrar.</div>

            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">E-mail</label>
                    <input type="email" id="username" name="username">
                </div>
                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha">
                </div>
                <button class="btn-primary" type="submit">Entrar</button>
            </form>

            <p class="form-footer">Ainda não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
        </div>
    </div>
</div>
</body>
</html>
